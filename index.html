<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateforme de suivi des cultures</title>
<style>
:root{--bg:#f1f4ec;--card:#fff;--ink:#1c2a20;--mute:#5d6b60;--line:#d5dccd;--leaf:#2d6a3e;--leaf-d:#1f4d2c;--sun:#d99a00;--red:#a63b2a;--side:#1f3a28;--side-ink:#e6efe4}
@media (prefers-color-scheme:dark){:root{--bg:#141b16;--card:#1d2720;--ink:#e8efe6;--mute:#9bab9e;--line:#2f3d33;--leaf:#5cb372;--leaf-d:#7ccf92;--sun:#f0b429;--red:#e07a69;--side:#0e1510;--side-ink:#dbe7d9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:22px 14px;font-family:system-ui,sans-serif;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
aside h1{font:700 1.15rem Georgia,serif;margin:0 6px}
nav{display:flex;flex-direction:column;gap:3px}
nav a{color:var(--side-ink);text-decoration:none;padding:10px 12px;border-radius:4px;font-size:.93rem}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:var(--sun);color:#1c1c1c;font-weight:600}
.side-b{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.who{font-size:.8rem;opacity:.9;padding:0 6px;word-break:break-all}
main{padding:26px 28px 60px;min-width:0}
h2.pt{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
form,.crop,.kpi,.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;font-family:system-ui,sans-serif}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
button{font:600 .9rem system-ui,sans-serif;padding:9px 14px;border:0;border-radius:4px;background:var(--leaf);color:#fff;cursor:pointer}
button.alt{background:transparent;color:inherit;border:1px solid var(--line)}
aside button.alt{border-color:rgba(255,255,255,.3)}
button.x{background:none;color:var(--red);padding:2px 8px}
button.lnk{background:none;color:var(--leaf-d);padding:4px 0;text-decoration:underline;font-weight:400}
button[disabled]{cursor:default;opacity:.65}
:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.grid button{align-self:end}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-family:system-ui,sans-serif;align-items:center}
.bar select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{margin:0}
.kpi b{display:block;font:700 1.5rem Georgia,serif}
.kpi span{font:.82rem system-ui,sans-serif;color:var(--mute)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font:.9rem system-ui,sans-serif}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0;background:var(--bg)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.head h3{margin:0;font-size:1.25rem}
.meta{color:var(--mute);font:.85rem system-ui,sans-serif}
.stages{display:flex;margin:14px 0 10px;gap:3px;font-family:system-ui,sans-serif}
.stages button{flex:1;padding:8px 2px;font-size:.78rem;white-space:normal;line-height:1.2;background:var(--line);color:var(--mute);border-radius:3px}
.stages button.done{background:var(--leaf);color:#fff}
.stages button.now{background:var(--sun);color:#1c1c1c}
.tot{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px;font:600 .92rem system-ui,sans-serif;color:var(--leaf-d)}
.log{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem}
.log li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.log .t{flex:1}
.log time{color:var(--mute);font:.8rem system-ui,sans-serif;min-width:78px}
.tag{font:600 .75rem system-ui,sans-serif;background:var(--line);padding:2px 7px;border-radius:3px;margin-right:6px}
.tag.rec{background:var(--leaf);color:#fff}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font:600 .92rem system-ui,sans-serif}
.act{margin-top:10px}
.hid{display:none}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.guide{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sun);border-radius:6px;padding:16px 18px;margin-bottom:16px;font-family:system-ui,sans-serif;font-size:.95rem}
.guide h3{margin:0 0 6px;font:700 1.15rem Georgia,serif}
.guide ol{margin:8px 0 12px;padding-left:22px}
.guide li{margin:7px 0}
.legend{font:.85rem system-ui,sans-serif;color:var(--mute);margin:0 0 14px}
.login{max-width:380px;margin:50px auto}
.login h2{margin-top:0}
.login .grid{grid-template-columns:1fr}
.ro{background:var(--line);color:var(--ink);font:.85rem system-ui,sans-serif;padding:8px 12px;border-radius:4px;margin-bottom:14px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{flex-direction:row;flex-wrap:wrap}.side-b{flex-direction:row;flex-wrap:wrap;margin:0}main{padding:18px 14px 50px}}
@media print{aside,.bar,form,details,button,.noprint{display:none!important}.app{display:block}main{padding:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Suivi des cultures</h1>
    <nav id="nav" aria-label="Navigation"></nav>
    <div class="side-b">
      <div class="who" id="who"></div>
      <button class="alt" id="help" hidden>Comment commander ?</button>
      <button class="alt" id="exp">Sauvegarde (JSON)</button>
      <button class="alt" id="imp">Restaurer</button>
      <input type="file" id="file" accept="application/json" hidden>
      <button class="alt" id="out" hidden>Déconnexion</button>
    </div>
  </aside>
  <main id="view"><p class="empty">Chargement…</p></main>
</div>

<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,initializeAuth,browserSessionPersistence,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,writeBatch,query,where,increment} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== À REMPLIR : Firebase > Paramètres du projet > Vos applications > Configuration ====== */
const FIREBASE={apiKey:"AIzaSyBvqyi5iNCBoSOegd4RCumzVOtgFSVu0rA",authDomain:"suivi-cultures-e01e5.firebaseapp.com",projectId:"suivi-cultures-e01e5",appId:"1:665920260451:web:93dce6e645e1f1427c2b56"};
/* ========================================================================================== */

const configured=!String(FIREBASE.apiKey).startsWith("COLLEZ");
const ETAPES=["Préparation du sol","Semis","Levée","Croissance","Floraison","Récolte"];
const TYPES=["Préparation du sol","Semis","Levée","Croissance","Floraison","Récolte","Repiquage","Arrosage","Fertilisation","Désherbage","Traitement","Taille / entretien","Autre"];
const ROLES=[["admin","Administrateur"],["editeur","Éditeur (saisie)"],["lecteur","Lecteur (consultation)"],["client","Client (commande seulement)"],["aucun","Désactivé"]];
const roleLabel=r=>(ROLES.find(x=>x[0]===r)||[0,"En attente"])[1];
const KEY="suivi-cultures-v1";

let app,auth,db,me=null,role="aucun",ready=false,pending=false;
let cultures=[],acts=[],users=[],data=[],produits=[],commandes=[],myNom="",myTel="",authMode="login",registering=false,unsubs=[],unsubProfile=null;
let S={culture:"",type:"",etape:""},cur=null;
const canEdit=()=>role==="editeur"||role==="admin";
const isAdmin=()=>role==="admin";
const canSee=()=>role==="lecteur"||role==="editeur"||role==="admin";
const isClient=()=>role==="client";
const hasAccess=()=>canSee()||isClient();
const STAT={en_attente:"En attente",confirmee:"Confirmée",livree:"Livrée",annulee:"Annulée"};
const hasStock=p=>p.stock!==""&&p.stock!=null&&!isNaN(+p.stock);
const detCmd=c=>(c.lignes||[]).map(l=>`${nb(l.qte)} ${l.unite} ${l.nom}`).join(", ");
const consomme=st=>st==="confirmee"||st==="livree";
const guideKey=()=>"guide-commande-"+(me?me.uid:"");
const guideVu=()=>{try{return localStorage.getItem(guideKey())==="1"}catch(e){return false}};
const guideShow=()=>S.guide===true||(S.guide===undefined&&!guideVu());
const guideBox=()=>`<section class="guide noprint" aria-label="Guide">
  <h3>Bienvenue${myNom?", "+esc(myNom.split(" ")[0]):""} ! Comment passer commande</h3>
  <ol>
    <li><b>Choisissez vos produits.</b> Dans la liste ci-dessous, repérez les produits disponibles avec leur prix et la quantité encore en stock.</li>
    <li><b>Indiquez les quantités.</b> Saisissez la quantité voulue en face de chaque produit : le total se calcule tout seul. Laissez vide les produits que vous ne voulez pas.</li>
    <li><b>Précisez la livraison.</b> Écrivez le lieu et la date souhaités, puis cliquez sur « Envoyer la commande ».</li>
    <li><b>Suivez votre commande.</b> Ouvrez « Mes commandes » dans le menu : vous y voyez l'état de chaque commande. Tant qu'elle est « En attente », vous pouvez l'annuler.</li>
  </ol>
  <p class="meta">Vous ne voyez que vos propres commandes. Vous pourrez relire ce guide à tout moment avec le bouton « Comment commander ? » du menu.</p>
  <button data-go="guideok">J'ai compris</button>
</section>`;

const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=d=>d?new Date(d+"T00:00").toLocaleDateString("fr-FR"):"—";
const jours=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const nb=n=>(+n).toLocaleString("fr-FR",{maximumFractionDigits:2});
const sum=c=>{const J=c.journal;return{
  rec:J.filter(j=>j.type==="Récolte").reduce((s,j)=>s+(+j.q||0),0),
  recette:J.reduce((s,j)=>s+(+j.total||0),0),
  cout:J.reduce((s,j)=>s+(+j.cout||0),0)}};
const det=j=>[j.num&&`Récolte n° ${j.num}`,j.prod&&`Produit : ${j.prod}${j.qp?` · ${nb(j.qp)} ${j.unit}`:""}`,j.t].filter(Boolean).join(" · ");
const sel=(attr,val,opts,all)=>`<select data-flt="${attr}" aria-label="${all}"><option value="">${all}</option>${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
const run=async fn=>{try{await fn();return true}catch(e){alert("Action impossible ou refusée ("+(e.code||e.message)+").");return false}};

/* ---------- données (temps réel) ---------- */
function rebuild(){
  data=cultures.map(c=>({...c,journal:acts.filter(a=>a.cultureId===c.id)})).sort((a,b)=>(b.created||0)-(a.created||0));
}
function refresh(){
  const ae=document.activeElement;
  if(ae&&["INPUT","SELECT"].includes(ae.tagName)&&ae.closest(".act,#f,#fu,#fl,#fr,#fo,#fp")){pending=true;return}
  render();
}
document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{if(pending)refresh()},250)});
function stopData(){unsubs.forEach(u=>u());unsubs=[];cultures=[];acts=[];users=[];data=[];produits=[];commandes=[]}
function startData(){
  stopData();
  if(!hasAccess())return;
  const err=e=>console.error(e);
  unsubs.push(onSnapshot(collection(db,"produits"),s=>{produits=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},err));
  const cq=canEdit()?collection(db,"commandes"):query(collection(db,"commandes"),where("uid","==",me.uid));
  unsubs.push(onSnapshot(cq,s=>{commandes=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},err));
  if(canSee()){
    unsubs.push(onSnapshot(collection(db,"cultures"),s=>{cultures=s.docs.map(d=>({id:d.id,...d.data()}));rebuild();refresh()},err));
    unsubs.push(onSnapshot(collection(db,"activites"),s=>{acts=s.docs.map(d=>({id:d.id,...d.data()}));rebuild();refresh()},err));
  }
  if(isAdmin())unsubs.push(onSnapshot(collection(db,"users"),s=>{users=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.email).localeCompare(String(b.email)));refresh()},err));
}
async function setStatut(o,st){
  const prev=o.statut;if(prev===st)return;
  const dec=!consomme(prev)&&consomme(st),inc=consomme(prev)&&!consomme(st);
  if(dec){
    const bad=(o.lignes||[]).find(l=>{const p=produits.find(x=>x.id===l.produitId);return p&&hasStock(p)&&+p.stock<l.qte});
    if(bad&&!confirm(`Stock insuffisant pour ${bad.nom}. Confirmer quand même ?`))return;
  }
  await run(async()=>{
    const bt=writeBatch(db);
    bt.update(doc(db,"commandes",o.id),{statut:st});
    if(dec||inc)(o.lignes||[]).forEach(l=>{const p=produits.find(x=>x.id===l.produitId);if(p&&hasStock(p))bt.update(doc(db,"produits",p.id),{stock:increment(dec?-l.qte:l.qte)})});
    await bt.commit();
  });
}
function norm(c){
  if(!c.v){c.etape=Math.min((+c.etape||0)+1,5);c.v=2}
  c.journal=(c.journal||[]).map(j=>({d:j.d,type:j.type||"Autre",t:j.t||"",q:j.q||null,pu:j.pu||null,total:j.total||null,num:j.num||null,prod:j.prod||"",qp:j.qp||null,unit:j.unit||"",cout:j.cout||null}));
  if(c.rendement!=null){c.journal.push({d:c.semis,type:"Récolte",t:"Récolte (ancienne saisie)",q:c.rendement,pu:null,total:null,num:null,prod:"",qp:null,unit:"",cout:null});delete c.rendement}
  const hs=c.journal.filter(j=>j.type==="Récolte");
  let n=Math.max(0,...hs.map(j=>+j.num||0));
  hs.filter(j=>!j.num).sort((a,b)=>a.d.localeCompare(b.d)).forEach(j=>{j.num=++n});
  return c;
}
async function importAll(arr){
  let n=0;
  for(const raw of arr){
    const c=norm(JSON.parse(JSON.stringify(raw)));
    const ref=await addDoc(collection(db,"cultures"),{nom:c.nom,parcelle:c.parcelle||"",semis:c.semis,prevue:c.prevue||"",surface:c.surface||"",etape:c.etape,v:2,created:Date.now()+n});
    const b=writeBatch(db);
    c.journal.forEach(j=>b.set(doc(collection(db,"activites")),{cultureId:ref.id,...j}));
    await b.commit();n++;
  }
  return n;
}
const localData=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)&&d.length?d:null}catch(e){return null}};

/* ---------- affichage ---------- */
function table(name,cols,rows,foot,num=[]){
  cur={name,cols,rows,foot};
  const cl=i=>num.includes(i)?' class="n"':"";
  return `<div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th${cl(i)}>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    rows.length?rows.map(r=>`<tr>${r.map((x,i)=>`<td${cl(i)}>${esc(x)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="empty">Aucune donnée pour le moment.</td></tr>`
  }</tbody>${foot?`<tfoot><tr>${foot.map((x,i)=>`<td${cl(i)}>${esc(x)}</td>`).join("")}</tr></tfoot>`:""}</table></div>`;
}
const tools=withType=>`<div class="bar">${sel("culture",S.culture,data.map(c=>c.nom),"Toutes les cultures")}${withType?sel("type",S.type,TYPES,"Toutes les activités"):""}<button class="alt" data-go="csv">Exporter en CSV (Excel)</button><button class="alt" data-go="print">Imprimer</button></div>`;
const head=(t,s)=>`<h2 class="pt">${t}</h2><p class="sub">${s}</p>`;
const roBanner=()=>canEdit()?"":`<p class="ro noprint">Vous êtes en consultation seule : seuls les éditeurs et l'administrateur peuvent saisir des données.</p>`;
const allActs=()=>data.filter(c=>!S.culture||c.nom===S.culture).flatMap(c=>c.journal.map(j=>({c,j}))).sort((a,b)=>b.j.d.localeCompare(a.j.d));

function applyType(box){
  const v=box.querySelector('[data-f="type"]').value;
  const r=v==="Récolte",pr=v==="Fertilisation"||v==="Traitement"||v==="Semis";
  box.querySelectorAll(".rf").forEach(x=>x.classList.toggle("hid",!r));
  box.querySelectorAll(".pf").forEach(x=>x.classList.toggle("hid",!pr));
  box.querySelector(".cf").classList.toggle("hid",r);
  if(r){const n=box.querySelector('[data-f="num"]');
    if(!n.dataset.touched){
      const cid=box.dataset.cid||box.querySelector('[data-f="cid"]').value,c=data.find(x=>x.id==cid);
      n.value=c?Math.max(0,...c.journal.filter(j=>j.type==="Récolte").map(j=>+j.num||0))+1:1}}
}
function actForm(types,cid){
  return `<div class="grid act"${cid?` data-cid="${cid}"`:""}>
    ${cid?"":`<label>Culture<select data-f="cid">${data.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("")}</select></label>`}
    <label>Date<input type="date" data-f="d" value="${today()}"></label>
    <label>Activité<select data-f="type">${types.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label class="rf hid">N° de la récolte<input type="number" min="1" step="1" data-f="num"></label>
    <label class="rf hid">Quantité (kg)<input type="number" min="0" step="any" data-f="q"></label>
    <label class="rf hid">Prix unitaire (FCFA/kg)<input type="number" min="0" step="any" data-f="pu"></label>
    <label class="rf hid">Prix total (FCFA)<input type="number" min="0" step="any" data-f="total"></label>
    <label class="pf hid">Produit / semence<input data-f="prod" placeholder="Ex. : NPK 15-15-15, urée, variété…"></label>
    <label class="pf hid">Quantité<input type="number" min="0" step="any" data-f="qp"></label>
    <label class="pf hid">Unité<select data-f="unit"><option>kg</option><option>g</option><option>L</option><option>mL</option><option>sacs</option></select></label>
    <label class="cf">Coût (FCFA)<input type="number" min="0" step="any" data-f="cout" placeholder="Optionnel"></label>
    <label style="grid-column:1/-1">Détails / observations<input data-f="t" placeholder="Remarques"></label>
    <button data-act="note">Enregistrer</button>
  </div>`;
}
const formBox=(title,types)=>!canEdit()?roBanner():data.length?`<section class="crop noprint"><div class="head"><h3>${title}</h3></div>${actForm(types,null)}</section>`:`<p class="empty noprint">Ajoutez d'abord une culture dans la page « Cultures ».</p>`;

const VIEWS={
tableau(){
  const T=data.reduce((a,c)=>{const s=sum(c);a.k+=s.rec;a.r+=s.recette;a.d+=s.cout;return a},{k:0,r:0,d:0});
  const k=[["Cultures suivies",data.length],["En récolte",data.filter(c=>c.etape===5).length],["Total récolté",nb(T.k)+" kg"],["Recettes",nb(T.r)+" FCFA"],["Dépenses",nb(T.d)+" FCFA"],["Bénéfice",nb(T.r-T.d)+" FCFA"],...(canEdit()?[["Commandes en attente",commandes.filter(c=>c.statut==="en_attente").length]]:[])];
  return head("Tableau de bord","Vue d'ensemble de toutes vos cultures.")+roBanner()+
   `<div class="kpis">${k.map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`+
   `<div class="bar"><button class="alt" data-go="csv">Exporter en CSV (Excel)</button><button class="alt" data-go="print">Imprimer</button></div>`+
   table("tableau-de-bord",["Culture","Parcelle","Étape","Semis","Récolté (kg)","Recettes (FCFA)","Dépenses (FCFA)","Bénéfice (FCFA)"],
    data.map(c=>{const s=sum(c);return[c.nom,c.parcelle||"—",ETAPES[c.etape],fr(c.semis),nb(s.rec),nb(s.recette),nb(s.cout),nb(s.recette-s.cout)]}),
    ["Total","","","",nb(T.k),nb(T.r),nb(T.d),nb(T.r-T.d)],[4,5,6,7]);
},
journal(){
  const r=allActs().filter(x=>!S.type||x.j.type===S.type);
  return head("Journal des activités","Toutes les activités réalisées, de la plus récente à la plus ancienne.")+formBox("Enregistrer une activité",TYPES)+tools(true)+
   table("journal",["Date","Culture","Activité","Détails","Quantité récoltée (kg)","Montant (FCFA)"],
    r.map(({c,j})=>[fr(j.d),c.nom,j.type,det(j),j.q?nb(j.q):"",j.type==="Récolte"?(j.total?nb(j.total):""):(j.cout?"− "+nb(j.cout):"")]),null,[4,5]);
},
recoltes(){

  const rows=c.journal.map((j,i)=>({...j,i})).sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i);
  return `<section class="crop" data-id="${esc(c.id)}">
    <div class="head"><h3>${esc(c.nom)}</h3><span class="meta">${esc(c.parcelle)||"Sans parcelle"}${surf?` · ${nb(surf)} m²`:""}</span></div>
    <div class="meta">Début le ${fr(c.semis)} · ${info}</div>
    <div class="stages" role="group" aria-label="Étape">${ETAPES.map((e,i)=>`<button ${ed?"":"disabled"} data-act="etape" data-i="${i}" class="${i<c.etape?"done":i===c.etape?"now":""}" aria-pressed="${i===c.etape}">${e}</button>`).join("")}</div>
    ${ed&&c.etape<ETAPES.length-1?`<button data-act="next">Étape suivante : ${ETAPES[c.etape+1]} →</button>`:""}
    <div class="tot"><span>Récolté : ${nb(s.rec)} kg${surf&&s.rec?` (${nb(s.rec/surf)} kg/m²)`:""}</span><span>Recettes : ${nb(s.recette)} FCFA</span><span>Dépenses : ${nb(s.cout)} FCFA</span><span>Bénéfice : ${nb(s.recette-s.cout)} FCFA</span></div>
    ${ed?`<details><summary>Enregistrer une activité</summary>${actForm(TYPES,c.id)}</details>`:""}
    <ul class="log">${rows.map(j=>`<li><time>${fr(j.d)}</time><span class="t"><span class="tag ${j.type==="Récolte"?"rec":""}">${esc(j.type)}</span>${esc(det(j))}${j.q?`${det(j)?" · ":""}${nb(j.q)} kg`:""}${j.pu?` × ${nb(j.pu)} FCFA/kg`:""}${j.total?` = ${nb(j.total)} FCFA`:""}${j.cout?` · ${nb(j.cout)} FCFA`:""}</span>${ed?`<button class="x" data-act="del" data-i="${j.i}" aria-label="Supprimer cette activité">Supprimer</button>`:""}</li>`).join("")}</ul>

document.addEventListener("submit",async e=>{
  const id=e.target.id;if(!["f","fu","fl","fr","fo","fp"].includes(id))return;
  e.preventDefault();
  const v=Object.fromEntries(new FormData(e.target));
  if(id==="fl"){
    try{await signInWithEmailAndPassword(auth,v.email.trim(),v.password);location.hash="#tableau"}
    catch(x){alert("Adresse e-mail ou mot de passe incorrect.")}
  }else if(id==="fr"){
    if(v.password!==v.password2){alert("Les deux mots de passe ne sont pas identiques.");return}
    registering=true;
    try{
      const cred=await createUserWithEmailAndPassword(auth,v.email.trim(),v.password);
      await setDoc(doc(db,"users",cred.user.uid),{email:cred.user.email,nom:v.nom.trim(),tel:v.tel.trim(),role:"client"});
      location.hash="#commander";
    }catch(x){
      alert(x.code==="auth/email-already-in-use"?"Cette adresse e-mail a déjà un compte. Connectez-vous.":x.code==="auth/weak-password"?"Mot de passe trop court (6 caractères minimum).":x.code==="auth/invalid-email"?"Adresse e-mail invalide.":"Inscription impossible ("+(x.code||x.message)+").");
    }finally{registering=false}
  }else if(id==="fo"){
    const lignes=[...document.querySelectorAll("[data-qty]")].map(i=>({p:produits.find(x=>x.id===i.dataset.qty),q:+i.value})).filter(x=>x.q>0&&x.p);
    if(!lignes.length){alert("Indiquez au moins une quantité.");return}
    const bad=lignes.find(x=>hasStock(x.p)&&x.q>+x.p.stock);
    if(bad){alert(`La quantité demandée dépasse le stock disponible pour ${bad.p.nom} (${nb(bad.p.stock)} ${bad.p.unite}).`);return}
    const total=lignes.reduce((t,x)=>t+x.q*(+x.p.prix||0),0);
    const ok=await run(()=>addDoc(collection(db,"commandes"),{uid:me.uid,email:me.email,nom:myNom,tel:myTel,date:today(),
      lignes:lignes.map(x=>({produitId:x.p.id,nom:x.p.nom,unite:x.p.unite,prix:+x.p.prix||0,qte:x.q})),total,statut:"en_attente",note:(v.note||"").trim(),created:Date.now()}));
    if(ok){alert("Commande envoyée ! Vous pouvez suivre son état dans « Mes commandes ».");location.hash="#mescommandes";render()}
  }else if(id==="fp"&&canEdit()){
    const ok=await run(()=>addDoc(collection(db,"produits"),{nom:v.nom.trim(),unite:v.unite,prix:+v.prix||0,stock:v.stock===""?"":+v.stock,actif:true,created:Date.now()}));
    if(ok)render();
  }else if(id==="f"&&canEdit()){
    const ok=await run(async()=>{
      const ref=await addDoc(collection(db,"cultures"),{nom:v.nom.trim(),parcelle:v.parcelle.trim(),semis:v.semis,prevue:v.prevue||"",surface:v.surface||"",etape:+v.etape,v:2,created:Date.now()});
      await addDoc(collection(db,"activites"),{cultureId:ref.id,d:v.semis,type:+v.etape===0?"Préparation du sol":"Semis",t:+v.etape===0?"Début de la préparation du sol":"Semis effectué",q:null,pu:null,total:null,num:null,prod:"",qp:null,unit:"",cout:null});
    });
    if(ok)render();
  }else if(id==="fu"&&isAdmin()){
    const sec=initializeApp(FIREBASE,"sec"+Date.now());
    try{
      const sa=getAuth(sec);
      const cred=await createUserWithEmailAndPassword(sa,v.email.trim(),v.password);
      await setDoc(doc(db,"users",cred.user.uid),{email:v.email.trim(),nom:v.nom.trim(),role:v.role});
      await signOut(sa);
      alert(`Utilisateur créé. Communiquez-lui son adresse e-mail et son mot de passe.`);
      e.target.reset();
    }catch(x){
      alert(x.code==="auth/email-already-in-use"?"Cette adresse e-mail a déjà un compte.":x.code==="auth/weak-password"?"Mot de passe trop court (6 caractères minimum).":"Création impossible ("+(x.code||x.message)+").");
    }finally{await deleteApp(sec).catch(()=>{})}
  }
});

document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go==="guideok"){
    S.guide=false;try{localStorage.setItem(guideKey(),"1")}catch(x){}
    render();return;
  }
  if(b.dataset.go==="signup"||b.dataset.go==="login"){authMode=b.dataset.go;render();return}
  if(b.dataset.go==="print"){window.print();return}
  if(b.dataset.go==="csv"){
    const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;
    const lines=[cur.cols,...cur.rows,...(cur.foot?[cur.foot]:[])].map(r=>r.map(q).join(";"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
    a.download=`${cur.name}-${today()}.csv`;a.click();return;
  }
  if(b.dataset.go==="reset"){
    const em=($("#fl [name=email]")||{}).value;
    if(!em){alert("Saisissez d'abord votre adresse e-mail dans le champ ci-dessus.");return}
    await run(async()=>{await sendPasswordResetEmail(auth,em.trim());alert("Un e-mail de réinitialisation vient d'être envoyé (vérifiez aussi les courriers indésirables).")});return;
  }
  if(b.dataset.go==="importlocal"){
    const d=localData();if(!d||!confirm(`Importer ${d.length} culture(s) dans la base partagée ?`))return;
    if(await run(async()=>{await importAll(d)})){localStorage.removeItem(KEY);alert("Import terminé.");render()}return;
  }
  if(b.dataset.act==="cancelc"){
    if(!confirm("Annuler cette commande ?"))return;
    await run(()=>updateDoc(doc(db,"commandes",b.dataset.oid),{statut:"annulee"}));return;
  }
  if(b.dataset.act==="delp"&&canEdit()){
    if(!confirm("Supprimer ce produit du catalogue ?"))return;
    await run(()=>deleteDoc(doc(db,"produits",b.dataset.pid)));return;
  }
  const a=b.dataset.act;if(!a||!canEdit())return;
  const el=b.closest(".crop");
  let c=el?data.find(x=>x.id==el.dataset.id):null;
  if(a==="note"){
    const box=b.closest(".act");
    const cid=box.dataset.cid||box.querySelector('[data-f="cid"]').value;
    c=data.find(x=>x.id==cid);
    if(!c){alert("Choisissez une culture.");return}
    const g=k=>box.querySelector(`[data-f="${k}"]`).value.trim();
    const type=g("type"),t=g("t"),d=g("d")||today();
    const base={d,type,t,q:null,pu:null,total:null,num:null,prod:"",qp:null,unit:"",cout:null};
    if(type==="Récolte"){
      const q=+g("q"),pu=+g("pu"),tot=+g("total"),num=Math.floor(+g("num"));
      if(!(num>0)){alert("Indiquez le numéro de la récolte.");return}
      if(!(q>0)){alert("Indiquez la quantité récoltée.");return}
      if(c.journal.some(j=>j.type==="Récolte"&&+j.num===num)&&!confirm(`La récolte n° ${num} existe déjà pour cette culture. Enregistrer quand même ?`))return;
      const total=tot>0?tot:(pu>0?q*pu:null);
      Object.assign(base,{q,num,total,pu:pu>0?pu:(total?total/q:null)});
    }else{
      const pt=type==="Fertilisation"||type==="Traitement",cout=g("cout");
      if(pt&&!g("prod")){alert("Indiquez le produit utilisé.");return}
      if(!pt&&!t&&!cout&&type==="Autre"){alert("Ajoutez au moins un détail.");return}
      Object.assign(base,{cout:cout?+cout:null});
      if(pt||type==="Semis")Object.assign(base,{prod:g("prod"),qp:g("qp")?+g("qp"):null,unit:g("unit")});
    }
    const idx=ETAPES.indexOf(type);
    const ok=await run(async()=>{
      await addDoc(collection(db,"activites"),{cultureId:c.id,...base});
      if(idx>c.etape)await updateDoc(doc(db,"cultures",c.id),{etape:idx});
    });
    if(ok)render();
  }else if(a==="etape"||a==="next"){
    const n=a==="next"?Math.min(c.etape+1,ETAPES.length-1):+b.dataset.i;
    S.focus={id:c.id,type:ETAPES[n]};
    const ok=await run(()=>updateDoc(doc(db,"cultures",c.id),{etape:n}));
    if(!ok)S.focus=null;else if(S.focus)render();
  }else if(a==="del"){
    const j=c.journal[+b.dataset.i];
    if(!j||!confirm("Supprimer cette activité ?"))return;
    if(await run(()=>deleteDoc(doc(db,"activites",j.id))))render();
  }else if(a==="suppr"){
    if(!confirm("Supprimer cette culture et tout son journal ?"))return;
    const ok=await run(async()=>{
      const bt=writeBatch(db);
      c.journal.forEach(j=>bt.delete(doc(db,"activites",j.id)));
      bt.delete(doc(db,"cultures",c.id));
      await bt.commit();
    });
    if(ok)render();
  }
});

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.flt){S[t.dataset.flt]=t.value;render();return}
  if(t.dataset.pf&&canEdit()){
    const f=t.dataset.pf;
    const val=f==="actif"?t.checked:f==="prix"?(+t.value||0):(t.value===""?"":+t.value);
    await run(()=>updateDoc(doc(db,"produits",t.dataset.pid),{[f]:val}));return;
  }
  if(t.dataset.ostat&&canEdit()){
    const o=commandes.find(x=>x.id===t.dataset.ostat);
    if(o)await setStatut(o,t.value);
    render();return;
  }
  if(t.dataset.urole&&isAdmin()){
    await run(()=>updateDoc(doc(db,"users",t.dataset.urole),{role:t.value}));return;
  }
  if(t.dataset.f==="type"||t.dataset.f==="cid"){const bx=t.closest(".act");if(t.dataset.f==="cid")bx.querySelector('[data-f="num"]').dataset.touched="";applyType(bx)}
});
document.addEventListener("input",e=>{
  if(e.target.dataset.qty!==undefined){
    let t=0;
    document.querySelectorAll("[data-qty]").forEach(i=>{const p=produits.find(x=>x.id===i.dataset.qty);if(p)t+=(+i.value||0)*(+p.prix||0)});
    const el=$("#ctot");if(el)el.textContent=nb(t)+" FCFA";return;
  }
  const f=e.target.dataset.f;if(f==="num")e.target.dataset.touched="1";if(!["q","pu","total"].includes(f))return;
  const box=e.target.closest(".act"),g=k=>box.querySelector(`[data-f="${k}"]`);
  const q=+g("q").value,pu=+g("pu").value,t=+g("total").value;
  if(f==="total"){if(q>0)g("pu").value=t>0?+(t/q).toFixed(2):""}
  else if(q>0&&pu>0)g("total").value=+(q*pu).toFixed(2);
});

$("#exp").onclick=()=>{
  const out=data.map(({created,...c})=>({...c,v:2,journal:c.journal.map(({id,cultureId,...j})=>j)}));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
  a.download=`cultures-${today()}.json`;a.click();
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
  const r=new FileReader();
  r.onload=async()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
      if(!confirm(`Ajouter ${d.length} culture(s) de cette sauvegarde à la base ?`))return;
      if(await run(()=>importAll(d)))alert("Restauration terminée.");
    }catch(x){alert("Fichier invalide.")}};
  if(e.target.files[0])r.readAsText(e.target.files[0]);e.target.value="";
};
$("#out").onclick=()=>signOut(auth);
$("#help").onclick=()=>{S.guide=true;if(location.hash!=="#commander")location.hash="#commander";render()};

/* ---------- démarrage ---------- */
if(!configured){render()}
else{
  // la session ne dépasse pas la fermeture de l'onglet : chaque nouvelle visite commence par la connexion
  app=initializeApp(FIREBASE);auth=initializeAuth(app,{persistence:browserSessionPersistence});db=getFirestore(app);
  render();
  onAuthStateChanged(auth,user=>{
    if(unsubProfile){unsubProfile();unsubProfile=null}
    stopData();S.guide=undefined;me=user;role="aucun";
    if(!user){authMode="login";ready=true;render();return}
    ready=false;render();
    const ref=doc(db,"users",user.uid);
    unsubProfile=onSnapshot(ref,async snap=>{
      if(!snap.exists()){if(registering)return;
        await setDoc(ref,{email:user.email,nom:(user.email||"").split("@")[0],role:"aucun"}).catch(e=>console.error(e));
        return;
      }
      const r=snap.data().role||"aucun";myNom=snap.data().nom||"";myTel=snap.data().tel||"";
      if(r!==role||!ready){role=r;startData()}
      ready=true;refresh();
    },e=>{console.error(e);ready=true;refresh()});
  });
}
</script>
